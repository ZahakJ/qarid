apply plugin: 'com.android.application'

// Release signing. android/keystore.properties (gitignored) points at a
// keystore outside the repo. Without it the release builds unsigned and
// `assembleDebug` is unaffected.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// App identity: android/identity.properties (gitignored; see
// identity.properties.example). Absent, the placeholders below are used.
def identityPropsFile = rootProject.file("identity.properties")
def identityProps = new Properties()
if (identityPropsFile.exists()) {
    identityProps.load(new FileInputStream(identityPropsFile))
}
def qaridAppId = identityProps.getProperty("applicationId") ?: "com.example.qarid"
def qaridLinkHost = identityProps.getProperty("appLinkHost") ?: "qarid.example.com"

// The version lives in version.properties.
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}
def qaridVersionCode = (versionProps.getProperty("versionCode") ?: "1").toInteger()
def qaridVersionName = versionProps.getProperty("versionName") ?: "1.0"

android {
    namespace = qaridAppId
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId qaridAppId
        // The App-Links host the manifest's intent-filter verifies against.
        manifestPlaceholders = [appLinkHost: qaridLinkHost]
        // Capacitor's plugin machinery reads these two as string resources and
        // they must equal applicationId, so they are DERIVED from it rather
        // than repeated in strings.xml where they would drift.
        resValue "string", "package_name", qaridAppId
        resValue "string", "custom_url_scheme", qaridAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode qaridVersionCode
        versionName qaridVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystoreProps.getProperty("storeFile")) {
                storeFile file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign only when the keystore is configured; otherwise stay unsigned.
            if (keystoreProps.getProperty("storeFile")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
