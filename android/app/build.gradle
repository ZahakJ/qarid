apply plugin: 'com.android.application'

// Release signing. android/keystore.properties (gitignored) points at a
// keystore outside the repo. Without it the release builds unsigned and
// `assembleDebug` is unaffected.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// App identity: android/identity.properties (gitignored; see
// identity.properties.example). Absent, the placeholders below are used, which
// only a debug build accepts (see qaridCheckReleaseIdentity below).
def identityPropsFile = rootProject.file("identity.properties")
def identityProps = new Properties()
if (identityPropsFile.exists()) {
    identityProps.load(new FileInputStream(identityPropsFile))
}
def qaridAppId = identityProps.getProperty("applicationId") ?: "com.example.qarid"
def qaridLinkHost = identityProps.getProperty("appLinkHost") ?: "qarid.example.com"
def qaridPlaceholderId = qaridAppId == "com.example" || qaridAppId.startsWith("com.example.")
def qaridPlaceholderHost = qaridLinkHost == "example.com" || qaridLinkHost.endsWith(".example.com")

// The version lives in version.properties.
def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.exists()) {
    versionProps.load(new FileInputStream(versionPropsFile))
}
def qaridVersionCode = (versionProps.getProperty("versionCode") ?: "1").toInteger()
def qaridVersionName = versionProps.getProperty("versionName") ?: "1.0"

android {
    namespace = qaridAppId
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId qaridAppId
        // The App-Links host the manifest's intent-filter verifies against.
        manifestPlaceholders = [appLinkHost: qaridLinkHost]
        // Capacitor's plugin machinery reads these two as string resources and
        // they must equal applicationId, so they are DERIVED from it rather
        // than repeated in strings.xml where they would drift.
        resValue "string", "package_name", qaridAppId
        resValue "string", "custom_url_scheme", qaridAppId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode qaridVersionCode
        versionName qaridVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Each value: keystore.properties, else -Pqarid.<key>, else the
            // environment variable. See docs/PLAY.md.
            def signing = { String key, String envName ->
                keystoreProps.getProperty(key) ?: (project.findProperty("qarid." + key) ?: System.getenv(envName))
            }
            def qaridStoreFile = signing("storeFile", "QARID_STORE_FILE")
            if (qaridStoreFile) {
                storeFile file(qaridStoreFile)
                storePassword signing("storePassword", "QARID_STORE_PASSWORD")
                keyAlias signing("keyAlias", "QARID_KEY_ALIAS")
                keyPassword signing("keyPassword", "QARID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign only when a keystore is configured; otherwise stay unsigned.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// The placeholders are for debug builds only. Every release variant (signed or
// not: assembleRelease, bundleRelease, `assemble`) and any build of a commit
// tagged v* stops here under them, and a release also stops when `cap sync`
// ran without the same id. v2.1.2 and v2.1.3 shipped as com.example.qarid
// and installed beside the real app instead of updating it.
// tools/android-identity.ts makes the same check for tools/android-bundle.sh.
def qaridSyncedConfig = file("src/main/assets/capacitor.config.json")
def qaridVersionTag = providers.exec {
    commandLine "git", "describe", "--exact-match", "--tags", "--match", "v*", "HEAD"
    ignoreExitValue = true
}.standardOutput.asText
def qaridIdentityProblems = { boolean release, String tag ->
    def problems = []
    if (qaridPlaceholderId) problems << "applicationId is the placeholder ${qaridAppId}".toString()
    if (qaridPlaceholderHost) problems << "appLinkHost is the placeholder ${qaridLinkHost}".toString()
    if (release) {
        def synced = qaridSyncedConfig.exists() ? new groovy.json.JsonSlurper().parse(qaridSyncedConfig).appId : null
        if (synced != qaridAppId) {
            problems << "the synced capacitor.config.json has appId ${synced}, applicationId is ${qaridAppId} (run `npx cap sync android` again)".toString()
        }
    }
    if (!problems) return null
    def why = release ? "a release build" : "a build of version tag ${tag}"
    return "Refusing ${why}:\n  - ".toString() + problems.join("\n  - ") +
        "\nSet android/identity.properties (see identity.properties.example). The com.example placeholders are for debug builds only."
}
def qaridCheckRelease = tasks.register("qaridCheckReleaseIdentity") {
    doLast {
        def problem = qaridIdentityProblems(true, "")
        if (problem) throw new GradleException(problem)
    }
}
def qaridCheckTagged = tasks.register("qaridCheckTaggedIdentity") {
    doLast {
        def tag = ""
        try {
            tag = qaridVersionTag.get().trim()
        } catch (Exception ignored) {
            // No git, or not a checkout: no tag to hold the build to.
        }
        if (!tag) return
        def problem = qaridIdentityProblems(false, tag)
        if (problem) throw new GradleException(problem)
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach { dependsOn qaridCheckRelease }
tasks.matching { it.name == "preDebugBuild" }.configureEach { dependsOn qaridCheckTagged }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
